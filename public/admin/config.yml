# ─────────────────────────────────────────────
# Vincent's note 後台設定（Sveltia CMS）
# 只需要改下面 repo 這一行：換成你的 GitHub 帳號/儲存庫名稱
# ─────────────────────────────────────────────
backend:
  name: github
  repo: Hank-lcw/vincents-note
  branch: main
  commit_messages:
    create: "新增筆記：{{slug}}"
    update: "更新筆記：{{slug}}"
    delete: "刪除筆記：{{slug}}"
    uploadMedia: "上傳圖片：{{path}}"
    deleteMedia: "刪除圖片：{{path}}"

site_url: https://vincents-note.pages.dev
display_url: https://vincents-note.pages.dev
locale: en

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: notes
    label: 投資筆記
    label_singular: 筆記
    folder: src/content/notes
    create: true
    slug: "{{urlname}}"
    identifier_field: title
    summary: "{{title}}（{{grade}}）{{date | date('YYYY-MM-DD')}}"
    sortable_fields: [date, title, grade]
    view_filters:
      - { label: "草稿", field: draft, pattern: true }
    fields:
      - { name: title, label: 標題, widget: string }
      - name: urlname
        label: 網址代稱
        hint: "文章網址的最後一段，只能用小寫英文、數字和 -，例如 four-percent-rule。發布後請不要再改。"
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "只能用小寫英文、數字和 -"]
      - { name: date, label: 發布日期, widget: datetime, format: "YYYY-MM-DD", time_format: false, date_format: "YYYY-MM-DD" }
      - name: topic
        label: 主題
        widget: select
        options: [指數投資與資產配置, 學術研究解讀, 個人理財與退休]
      - name: grade
        label: 證據等級
        widget: select
        default: B
        options:
          - { label: "A｜多項研究一致", value: A }
          - { label: "B｜單篇研究支持", value: B }
          - { label: "C｜觀點與經驗", value: C }
      - { name: excerpt, label: 列表摘要, widget: text, hint: "首頁列表顯示的一兩句介紹" }
      - name: summary
        label: 重點摘要
        widget: list
        required: false
        hint: "文章開頭的重點，每點一句，建議 2–4 點"
        field: { name: point, label: 重點, widget: string }
      - name: body
        label: 內文
        widget: markdown
        hint: "用「標題 2」分段，會自動產生目錄。引用研究時直接打 [1]、[2]，會自動連到下方參考文獻。"
      - name: references
        label: 參考文獻
        widget: list
        required: false
        hint: "依引用順序填寫，第 1 筆對應內文的 [1]"
        field: { name: ref, label: 文獻, widget: string }
      - { name: draft, label: 草稿（勾選後不會顯示在網站上）, widget: boolean, default: false, required: false }

  - name: settings
    label: 網站設定
    files:
      - name: site
        label: 首頁文字與關於我
        file: src/data/site.json
        format: json
        fields:
          - { name: heroTitle, label: 首頁大標題, widget: text, hint: "換行會照樣顯示" }
          - { name: heroIntro, label: 首頁介紹文字, widget: text }
          - { name: about, label: 關於 Vincent, widget: text, hint: "換行會照樣顯示" }
          - { name: newsletterUrl, label: 訂閱連結, widget: string, required: false, hint: "電子報服務的訂閱頁網址；留空則顯示「訂閱功能即將開放」" }
          - { name: heroLead, label: 首頁主引言, widget: text, required: false }
          - { name: gaId, label: Google Analytics 評估 ID, widget: string, required: false, hint: "格式為 G- 開頭", pattern: ['^$|^G-[A-Z0-9]+$', "請輸入 G- 開頭的評估 ID，或留空"] }
          - { name: buttondownUsername, label: Buttondown 使用者名稱, widget: string, required: false }
